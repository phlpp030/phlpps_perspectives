<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>phlpp's perspectives</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%236F60DD'/%3E%3C/svg%3E">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="theme-color" content="#6F60DD">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    @font-face {
      font-family: 'Jost';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('./fonts/jost-400.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Jost';
      font-style: normal;
      font-weight: 800;
      font-display: swap;
      src: url('./fonts/jost-800.woff2') format('woff2');
    }
 
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    :root {
      --bg:     #F7F7F7;
      --ink:    #131210;
      --muted:  #9B9489;
      --accent: #6F60DD;
      --pad:    48px;
      --gap:    16px;
      --article-inset: 0px; /* mobile side inset — auch für Artikelseiten verwenden */
    }
 
    html, body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif;
      min-height: 100vh;
    }
 
    .page-wrap {
      max-width: 1050px;
      margin: 0 auto;
      width: 100%;
    }
 
    /* ── Header ── */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px var(--pad) 18px;
      gap: 12px;
    }
 
    .site-title {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      font-size: clamp(30px, 5.5vw, 52px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      text-transform: lowercase;
      color: var(--ink);
    }
 
    .header-unit {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 12px;
      width: 100%;
    }
 
    .header-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
 
    .title-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
 
    .site-subtitle {
      font-weight: 400;
      letter-spacing: 0.03em;
      text-transform: lowercase;
      color: var(--muted);
      white-space: nowrap;
      margin-top: 8px;
      /* font-size and margin-left set by JS */
    }
 
    .featured-img,
    .archive-thumb {
      position: relative;
    }
 
    .article-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(220, 218, 214, 0.68);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: lowercase;
      color: var(--ink);
      z-index: 1;
      pointer-events: none;
    }
 
    .header-row {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 var(--pad);
    }
 
    /* ── Blog grid ── */
    .blog {
      padding: 32px var(--pad) 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
 
    /* featured and archive get side inset (used on mobile + future article pages) */
    .featured,
    .archive {
      margin-left: var(--article-inset);
      margin-right: var(--article-inset);
    }
 
    /* Featured article */
    .featured {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--gap);
      align-items: start;
    }
 
    .featured-img {
      display: block;
      aspect-ratio: 4 / 3;
      width: 100%;
      overflow: hidden;
      background: #E0DDD6;
    }
 
    .featured-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
 
    .featured-img:hover img { transform: scale(1.03); }
 
    .featured-text {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-top: 4px;
    }
 
    .article-date {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: lowercase;
      color: var(--muted);
    }
 
    .article-title {
      font-size: clamp(22px, 4.5vw, 40px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.12;
      text-transform: lowercase;
      color: var(--ink);
      text-decoration: none;
      display: block;
    }
 
    .article-title:hover { color: var(--accent); }
 
    .article-excerpt {
      font-size: 15px;
      font-weight: 400;
      line-height: 1.7;
      color: var(--muted);
    }
 
    .read-more {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      color: var(--accent);
      text-decoration: none;
    }
 
    /* Archive thumbnails */
    .archive {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--gap);
    }
 
    .archive-thumb {
      display: block;
      text-decoration: none;
    }
 
    .thumb-img-wrap {
      display: block;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #E0DDD6;
      position: relative;
    }
 
    .thumb-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
 
    .archive-thumb:hover .thumb-img-wrap img { transform: scale(1.03); }
 
    .thumb-info {
      display: none; /* shown on mobile only */
    }
 
    .article-tags .article-tag {
      position: static;
      pointer-events: auto;
      display: inline-block;
    }
 
    .article-tags {
      display: none;
    }
 
    /* tags visible in featured text column on desktop */
    .featured-text .article-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
 
    .thumb-overlay {
      position: absolute;
      inset: 0;
      background: transparent;
      transition: background 0.35s ease;
      display: flex;
      align-items: flex-end;
      padding: 12px 14px;
    }
 
    .thumb-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.2;
      text-transform: lowercase;
      color: #fff;
      opacity: 0;
      transition: opacity 0.35s ease;
    }
 
    .thumb-img-wrap .thumb-overlay {
      position: absolute;
      inset: 0;
      background: transparent;
      transition: background 0.35s ease;
      display: flex;
      align-items: flex-end;
      padding: 12px 14px;
    }
 
    @media (hover: hover) and (pointer: fine) {
      .archive-thumb:hover .thumb-img-wrap .thumb-overlay { background: rgba(0, 0, 0, 0.32); }
      .archive-thumb:hover .thumb-title { opacity: 1; }
    }
 
    /* ── Footer ── */
    .site-footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      padding: 0 var(--pad);
      margin: 36px 0 40px;
    }
 
    .footer-left {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: flex-end;
    }
 
    .footer-emoji {
      font-size: 28px;
      line-height: 1;
      user-select: none;
    }
 
    .footer-link {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: lowercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }
 
    .footer-link:hover { color: var(--ink); }
 
    /* Desktop: tag only in text column for featured article */
    .featured .featured-img .article-tag { display: none; }
 
    /* Featured title: more breathing room */
    .featured-text .article-title {
      margin-top: 14px;
      margin-bottom: 14px;
    }
 
    /* ── Footer right side ── */
    .footer-right {
      display: flex;
      flex-direction: column;
      gap: 2px;
      justify-self: start;
    }
 
    .footer-tagline {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: lowercase;
      color: var(--muted);
    }
 
    .footer-copy {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: lowercase;
      color: var(--muted);
      justify-self: start;
    }
 
    /* ── Header sticky base ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      padding: 52px 0 28px;
    }
 
    .header-row {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 var(--pad);
    }
 
    .title-block {
      overflow: hidden;
      max-width: 600px;
    }
 
    .header-circle {
      flex-shrink: 0;
    }
 
    /* ── Responsive ── */
    @media (max-width: 760px) {
      :root { --article-inset: 16px; }
 
      /* Abstand Menüleiste → Artikel: nur die 12px der Leiste, wie beim Scrollen */
      .blog { padding-top: 0; }
 
      /* Kein Featured-Artikel auf Mobile — alle Artikel identisch im Feed */
      .featured { display: none; }
 
      /* Archiv wird zum einheitlichen Mobile-Feed */
      .archive {
        grid-template-columns: 1fr;
        gap: 40px;
      }
 
      .article-tags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
 
      .article-tags .article-tag { font-size: 13px; }
 
      /* Bild-Overlay-Tag ausblenden — Tag steht stattdessen im Textblock */
      .thumb-img-wrap .article-tag { display: none; }
 
      /* Hover-Overlay (Desktop-Feature) auf Mobile nicht nötig */
      .thumb-title { display: none; }
 
      .thumb-info {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        padding: 12px 0 0;
        width: 100%;
      }
 
      .thumb-info .article-tags,
      .thumb-info .article-date,
      .thumb-info .thumb-headline {
        width: auto;
        align-self: flex-start;
      }
 
      .thumb-info .thumb-excerpt {
        width: 100%;
        align-self: stretch;
      }
 
      .thumb-headline {
        font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.15;
        text-transform: lowercase;
        color: var(--ink);
      }
 
      .thumb-excerpt {
        font-size: 14px;
        font-weight: 400;
        line-height: 1.65;
        color: var(--muted);
      }
    }
 
    @media (max-width: 520px) {
      :root { --pad: 24px; --gap: 10px; }
      header { padding-top: 24px; padding-bottom: 16px; }
    }
 
    /* ── Desktop only ── */
    @media (min-width: 761px) {
      /* Featured-Konzept entfällt auf Desktop — einheitliches Karten-Grid */
      .featured { display: none; }
 
      /* 3 Artikel nebeneinander, größere Karten — füllt Zeile für Zeile von links */
      .archive {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        column-gap: 32px;
        row-gap: 56px;
      }
 
      /* Tag-Overlay auf dem Bild ausblenden — Tag steht im Textblock (wie Mobile) */
      .thumb-img-wrap .article-tag { display: none; }
 
      /* Hover-Titel-Overlay nicht mehr nötig, da Infos permanent sichtbar sind */
      .thumb-title { display: none; }
 
      .thumb-info {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        padding-top: 18px;
        width: 100%;
      }
 
      .thumb-info .article-tags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        width: auto;
        align-self: flex-start;
      }
 
      .thumb-info .article-tags .article-tag {
        font-size: 12px;
      }
 
      .thumb-info .article-date {
        font-size: 12px;
        width: auto;
        align-self: flex-start;
      }
 
      .thumb-headline {
        font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.18;
        text-transform: lowercase;
        color: var(--ink);
        width: auto;
        align-self: flex-start;
      }
 
      .thumb-excerpt {
        font-size: 15px;
        font-weight: 400;
        line-height: 1.65;
        color: var(--muted);
        width: 100%;
        align-self: stretch;
      }
    }
 
    /* ── Menüleiste (Desktop: filter links, Links rechts · Mobile: menu links, filter rechts) ── */
    .menu-band {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 calc(var(--pad) + var(--article-inset)) 22px;
      position: sticky;
      top: var(--header-h, 0px);
      background: var(--bg);
      z-index: 50;
    }
    .menu-item {
      font-family: inherit;
      font-size: 17px;
      font-weight: 400;
      letter-spacing: .01em;
      text-transform: lowercase;
      color: var(--ink);
      text-decoration: none;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      transition: color .2s ease;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .menu-item:hover,
    .menu-item.active { color: var(--accent); }
    .menu-ico { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; fill: none; }
    .filter-wrap, .menu-wrap { position: relative; }
    .menu-wrap { order: -1; }
 
    .filter-panel, .menu-links {
      position: absolute;
      top: calc(100% + 10px);
      background: #fff;
      border: .5px solid rgba(19,18,16,.14);
      border-radius: 10px;
      padding: 10px 13px;
      display: none;
    }
    .filter-panel { right: 0; width: 214px; }
    .menu-links { left: 0; min-width: 110px; flex-direction: column; gap: 6px; }
    .filter-panel.open { display: block; }
    .menu-links.open { display: flex; }
    .menu-desk { display: none; }
    .menu-links .menu-item { font-size: 17px; line-height: 1.3; }
 
    .filter-pills { display: flex; flex-wrap: wrap; gap: 4px; }
    .pill {
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .02em;
      line-height: 1.35;
      text-transform: lowercase;
      color: var(--ink);
      background: #E5E3E0;
      border: 0;
      border-radius: 20px;
      padding: 0 8px;
      cursor: pointer;
      transition: background .2s ease, color .2s ease;
    }
    .pill.on { background: var(--accent); color: #fff; }
    .filter-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .filter-clear {
      font-family: inherit;
      font-size: 13px;
      color: var(--muted);
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      transition: color .2s ease;
    }
    .filter-clear:hover { color: var(--accent); }
 
    @media (min-width: 761px) {
      .menu-band { padding: 0 var(--pad) 14px; }
      .menu-item { font-size: 20px; }
      .menu-ico, .menu-toggle { display: none; }
      .menu-desk { display: inline-flex; }
      .menu-wrap { order: 0; }
      .menu-links, .menu-links.open {
        position: static;
        display: flex;
        flex-direction: row;
        gap: 40px;
        background: none;
        border: 0;
        padding: 0;
        min-width: 0;
      }
      .menu-links .menu-item { font-size: 20px; line-height: normal; }
      .filter-panel { right: auto; left: 0; width: 290px; top: calc(100% + 12px); padding: 16px; box-shadow: 0 8px 28px rgba(19,18,16,.08); }
      .filter-pills { gap: 7px; }
      .pill { font-size: 12px; font-weight: 600; letter-spacing: .07em; background: rgba(220,218,214,.68); padding: 3px 12px; line-height: normal; }
      .pill.on { background: var(--accent); }
      .filter-foot { margin-top: 14px; }
    }
  </style>
</head>
<body>
  <div class="page-wrap">
 
  <header id="siteHeader">
    <div class="header-row">
      <div class="header-unit">
        <div class="header-circle"></div>
        <div class="title-block">
          <h1 class="site-title">
            <span>phlpp's</span>
            <span class="line-perspectives">perspectives</span>
          </h1>
          <p class="site-subtitle">photography and related thoughts</p>
        </div>
      </div>
    </div>
  </header>
 
  <nav class="menu-band" aria-label="menu">
    <div class="filter-wrap">
      <button type="button" class="menu-item" id="filterBtn" aria-expanded="false" aria-controls="filterPanel">
        <svg class="menu-ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4.5h14M4.5 9h9M7 13.5h4"/></svg><span id="filterLabel">filter</span>
      </button>
      <div class="filter-panel" id="filterPanel" role="dialog" aria-label="filter by tag">
        <div class="filter-pills" id="filterPills"></div>
        <div class="filter-foot">
          <button type="button" class="filter-clear" id="filterClear">clear</button>
          <span id="filterCount"></span>
        </div>
      </div>
    </div>
    <div class="menu-wrap">
      <button type="button" class="menu-item menu-toggle" id="menuBtn" aria-expanded="false" aria-controls="menuLinks">
        <svg class="menu-ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4.5h14M2 9h14M2 13.5h14"/></svg><span>menu</span>
      </button>
      <div class="menu-links" id="menuLinks">
        <a class="menu-item menu-desk" href="/construction.html">newsletter</a>
        <a class="menu-item" href="https://www.instagram.com/___phlpp/" target="_blank" rel="noopener">instagram</a>
        <a class="menu-item" href="/construction.html">about</a>
      </div>
    </div>
  </nav>
 
  <main class="blog">
 
    <!-- featured + archive werden per JS aus articles.json befüllt -->
    <article class="featured" id="featuredArticle"></article>
    <div class="archive" id="archiveGrid"></div>
 
  </main>
 
  <footer class="site-footer">
    <div class="footer-left">
      <a href="/privacy.html" class="footer-link">privacy</a>
      <a href="/imprint.html" class="footer-link">imprint</a>
    </div>
    <span class="footer-emoji">💌</span>
    <span class="footer-copy">© 2026 phlpp</span>
  </footer>
 
  </div><!-- /page-wrap -->
 
  <script>
    // Netlify Identity: nach Login zu /admin weiterleiten
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', user => {
        if (!user) {
          window.netlifyIdentity.on('login', () => {
            document.location.href = '/admin/';
          });
        }
      });
    }
 
    // "from berlin w/ love" — startet nach dem zweiten 'p', endet beim 's'
    // "perspectives" = p(0)e(1)r(2)s(3)p(4)e(5)c(6)t(7)i(8)v(9)e(10)s(11)
    function sizeSubtitle() {
      const persEl  = document.querySelector('.line-perspectives');
      const subtitle = document.querySelector('.site-subtitle');
      if (!persEl || !subtitle || !persEl.firstChild) return;
      const node = persEl.firstChild;
 
      // Linker Einzug: Breite von "pe" (Index 0–2)
      const rLeft = document.createRange();
      rLeft.setStart(node, 0);
      rLeft.setEnd(node, 2);
      const leftOffset = rLeft.getBoundingClientRect().width;
 
      // Zielbreite: von Index 2 bis Ende (12)
      const rWidth = document.createRange();
      rWidth.setStart(node, 2);
      rWidth.setEnd(node, 12);
      const targetWidth = rWidth.getBoundingClientRect().width;
 
      subtitle.style.marginLeft = leftOffset + 'px';
 
      // Binärsuche für die passende font-size
      let lo = 6, hi = 40;
      for (let i = 0; i < 40; i++) {
        const mid = (lo + hi) / 2;
        subtitle.style.fontSize = mid + 'px';
        subtitle.offsetWidth > targetWidth ? (hi = mid) : (lo = mid);
      }
      subtitle.style.fontSize = lo + 'px';
    }
 
    // Desktop: Menüleiste klebt direkt unter dem (ebenfalls fixierten) Header
    function setHeaderH() {
      const hd = document.getElementById('siteHeader');
      if (hd) document.documentElement.style.setProperty('--header-h', hd.getBoundingClientRect().height + 'px');
    }
    setHeaderH();
    document.fonts.ready.then(setHeaderH);
    window.addEventListener('resize', setHeaderH);
    if (window.ResizeObserver) new ResizeObserver(setHeaderH).observe(document.getElementById('siteHeader'));
 
    document.fonts.ready.then(sizeSubtitle);
    window.addEventListener('resize', sizeSubtitle);
 
    // ── Artikel aus articles.json laden ─────────────────────────
    function parsePostedDate(str) {
      if (!str) return new Date(0);
      const [d, m, y] = str.split('.').map(Number);
      return new Date(y, m - 1, d);
    }
 
    function esc(str) {
      return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
 
    function getTagsArr(a) {
      return Array.isArray(a.tags) ? a.tags
           : a.tags ? [a.tags]
           : a.tag  ? [a.tag]
           : [];
    }
 
    function renderTags(a) {
      return getTagsArr(a).map(t => `<span class="article-tag">${esc(t)}</span>`).join('');
    }
 
    function renderFeatured(a) {
      const el = document.getElementById('featuredArticle');
      if (!el) return;
      const link = `article.html?slug=${encodeURIComponent(a.slug)}`;
      const firstTag = getTagsArr(a)[0] || '';
      el.innerHTML = `
        <a href="${link}" class="featured-img">
          <img src="${esc(a.cover)}" alt="${esc(a.title)}" loading="lazy">
          ${firstTag ? `<span class="article-tag">${esc(firstTag)}</span>` : ''}
        </a>
        <div class="featured-text">
          <div class="article-tags">${renderTags(a)}</div>
          <span class="article-date">${esc(a.posted)}</span>
          <a href="${link}" class="article-title">${esc(a.title)}</a>
          <p class="article-excerpt">${esc(a.excerpt)}</p>
          <a href="${link}" class="read-more">read more</a>
        </div>`;
    }
 
    function renderArchive(articles) {
      const grid = document.getElementById('archiveGrid');
      if (!grid) return;
      grid.innerHTML = '';
      articles.forEach(a => {
        const link = `article.html?slug=${encodeURIComponent(a.slug)}`;
        const firstTag = getTagsArr(a)[0] || '';
        const el = document.createElement('a');
        el.href = link;
        el.className = 'archive-thumb';
        el.innerHTML = `
          <div class="thumb-img-wrap">
            <img src="${esc(a.cover)}" alt="${esc(a.title)}" loading="lazy">
            <div class="thumb-overlay"><span class="thumb-title">${esc(a.title)}</span></div>
            ${firstTag ? `<span class="article-tag">${esc(firstTag)}</span>` : ''}
          </div>
          <div class="thumb-info">
            <div class="article-tags">${renderTags(a)}</div>
            <span class="article-date">${esc(a.posted)}</span>
            <h3 class="thumb-headline">${esc(a.title)}</h3>
            <p class="thumb-excerpt">${esc(a.excerpt)}</p>
          </div>`;
        grid.appendChild(el);
      });
    }
 
    // Mobile: alle Artikel identisch, ohne Featured-Unterscheidung, ohne "read more"
    function renderMobileFeed(articles) {
      const grid = document.getElementById('archiveGrid');
      if (!grid) return;
      grid.innerHTML = '';
      articles.forEach(a => {
        const link = `article.html?slug=${encodeURIComponent(a.slug)}`;
        const el = document.createElement('a');
        el.href = link;
        el.className = 'archive-thumb';
        el.innerHTML = `
          <div class="thumb-img-wrap">
            <img src="${esc(a.cover)}" alt="${esc(a.title)}" loading="lazy">
          </div>
          <div class="thumb-info">
            <div class="article-tags">${renderTags(a)}</div>
            <span class="article-date">${esc(a.posted)}</span>
            <h3 class="thumb-headline">${esc(a.title)}</h3>
            <p class="thumb-excerpt">${esc(a.excerpt)}</p>
          </div>`;
        grid.appendChild(el);
      });
    }
 
    // ── Desktop: Tag-Filter (Mobile bleibt unberührt) ─────────────
    function initFilter(list) {
      const btn = document.getElementById('filterBtn');
      const panel = document.getElementById('filterPanel');
      const pillsEl = document.getElementById('filterPills');
      const countEl = document.getElementById('filterCount');
      const clearBtn = document.getElementById('filterClear');
      if (!btn || !panel) return;
 
      const allTags = [];
      list.forEach(a => getTagsArr(a).forEach(t => { if (allTags.indexOf(t) < 0) allTags.push(t); }));
      allTags.sort();
      let sel = [];
      let open = false;
 
      const matches = a => !sel.length || getTagsArr(a).some(t => sel.indexOf(t) > -1);
 
      function update() {
        const shown = list.filter(matches);
        // Karten nur ein-/ausblenden statt neu aufbauen → Bilder flackern nicht
        const cards = document.getElementById('archiveGrid').children;
        list.forEach((a, i) => { if (cards[i]) cards[i].style.display = matches(a) ? '' : 'none'; });
        document.getElementById('filterLabel').textContent = 'filter' + (sel.length ? ' (' + sel.length + ')' : '');
        btn.classList.toggle('active', open || sel.length > 0);
        btn.setAttribute('aria-expanded', open);
        panel.classList.toggle('open', open);
        pillsEl.querySelectorAll('.pill').forEach(p =>
          p.classList.toggle('on', sel.indexOf(p.dataset.t) > -1));
        countEl.textContent = shown.length + ' of ' + list.length;
      }
 
      pillsEl.innerHTML = allTags.map(t => `<button type="button" class="pill" data-t="${esc(t)}">${esc(t)}</button>`).join('');
      pillsEl.addEventListener('click', e => {
        const p = e.target.closest('.pill');
        if (!p) return;
        const t = p.dataset.t, i = sel.indexOf(t);
        i > -1 ? sel.splice(i, 1) : sel.push(t);
        update();
      });
      clearBtn.addEventListener('click', () => { sel = []; update(); });
      btn.addEventListener('click', () => {
        open = !open;
        if (open) document.dispatchEvent(new Event('filter-opened'));
        update();
      });
      document.addEventListener('menu-opened', () => { if (open) { open = false; update(); } });
      document.addEventListener('click', e => {
        if (open && !e.target.closest('.filter-wrap')) { open = false; update(); }
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && open) { open = false; update(); }
      });
      update();
    }
 
    // Mobile: "menu" klappt about + instagram auf
    function initMenu() {
      const btn = document.getElementById('menuBtn');
      const links = document.getElementById('menuLinks');
      if (!btn || !links) return;
      let open = false;
      const set = v => {
        open = v;
        links.classList.toggle('open', v);
        btn.classList.toggle('active', v);
        btn.setAttribute('aria-expanded', v);
      };
      btn.addEventListener('click', () => {
        set(!open);
        if (open) document.dispatchEvent(new Event('menu-opened'));
      });
      document.addEventListener('filter-opened', () => set(false));
      document.addEventListener('click', e => { if (open && !e.target.closest('.menu-wrap')) set(false); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape' && open) set(false); });
    }
 
    fetch('./articles.json')
      .then(r => r.json())
      .then(data => {
        const list = Array.isArray(data) ? data : (data.articles || []);
        list.sort((a, b) => parsePostedDate(b.posted) - parsePostedDate(a.posted));
 
        const isMobile = window.innerWidth <= 760;
        if (isMobile) {
          renderMobileFeed(list);
        } else {
          renderArchive(list);
        }
        initFilter(list);
        initMenu();
      })
      .catch(err => console.warn('articles.json nicht gefunden:', err));
  </script>
</html>
