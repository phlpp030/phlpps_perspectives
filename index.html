<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>phlpp's perspectives</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%236F60DD'/%3E%3C/svg%3E">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="theme-color" content="#6F60DD">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    @font-face {
      font-family: 'Jost';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('./fonts/jost-400.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Jost';
      font-style: normal;
      font-weight: 800;
      font-display: swap;
      src: url('./fonts/jost-800.woff2') format('woff2');
    }
 
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    :root {
      --bg:     #F7F7F7;
      --ink:    #131210;
      --muted:  #9B9489;
      --accent: #6F60DD;
      --pad:    48px;
      --gap:    16px;
      --article-inset: 0px; /* mobile side inset — auch für Artikelseiten verwenden */
    }
 
    html, body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif;
      min-height: 100vh;
    }
 
    .page-wrap {
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }
 
    /* ── Header ── */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 44px var(--pad) 24px;
      gap: 16px;
    }
 
    .site-title {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      font-size: clamp(26px, 5vw, 44px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      text-transform: lowercase;
      color: var(--ink);
    }
 
    .header-unit {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
    }
 
    .header-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
 
    .title-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
 
    .site-subtitle {
      font-weight: 400;
      letter-spacing: 0.03em;
      text-transform: lowercase;
      color: var(--muted);
      white-space: nowrap;
      margin-top: 5px;
      /* font-size and margin-left set by JS */
    }
 
    .featured-img,
    .archive-thumb {
      position: relative;
    }
 
    .article-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(220, 218, 214, 0.68);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: lowercase;
      color: var(--ink);
      z-index: 1;
      pointer-events: none;
    }
 
    .header-row {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 var(--pad);
    }
 
    /* ── Blog grid ── */
    .blog {
      padding: 32px var(--pad) 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
 
    /* featured and archive get side inset (used on mobile + future article pages) */
    .featured,
    .archive {
      margin-left: var(--article-inset);
      margin-right: var(--article-inset);
    }
 
    /* Featured article */
    .featured {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--gap);
      align-items: start;
    }
 
    .featured-img {
      display: block;
      aspect-ratio: 4 / 3;
      width: 100%;
      overflow: hidden;
      background: #E0DDD6;
    }
 
    .featured-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
 
    .featured-img:hover img { transform: scale(1.03); }
 
    .featured-text {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-top: 4px;
    }
 
    .article-date {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: lowercase;
      color: var(--muted);
    }
 
    .article-title {
      font-size: clamp(18px, 2.6vw, 28px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.12;
      text-transform: lowercase;
      color: var(--ink);
      text-decoration: none;
      display: block;
    }
 
    .article-title:hover { color: var(--accent); }
 
    .article-excerpt {
      font-size: 15px;
      font-weight: 400;
      line-height: 1.7;
      color: var(--muted);
    }
 
    .read-more {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      color: var(--accent);
      text-decoration: none;
    }
 
    /* Archive thumbnails */
    .archive {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--gap);
    }
 
    .archive-thumb {
      display: block;
      text-decoration: none;
    }
 
    .thumb-img-wrap {
      display: block;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #E0DDD6;
      position: relative;
    }
 
    .thumb-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
 
    .archive-thumb:hover .thumb-img-wrap img { transform: scale(1.03); }
 
    .thumb-info {
      display: none; /* shown on mobile only */
    }
 
    .article-tags .article-tag {
      position: static;
      pointer-events: auto;
      display: inline-block;
    }
 
    .article-tags {
      display: none; /* desktop: hidden — only shown on mobile via @media */
    }
 
    .thumb-overlay {
      position: absolute;
      inset: 0;
      background: transparent;
      transition: background 0.35s ease;
      display: flex;
      align-items: flex-end;
      padding: 12px 14px;
    }
 
    .thumb-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.2;
      text-transform: lowercase;
      color: #fff;
      opacity: 0;
      transition: opacity 0.35s ease;
    }
 
    .thumb-img-wrap .thumb-overlay {
      position: absolute;
      inset: 0;
      background: transparent;
      transition: background 0.35s ease;
      display: flex;
      align-items: flex-end;
      padding: 12px 14px;
    }
 
    @media (hover: hover) and (pointer: fine) {
      .archive-thumb:hover .thumb-img-wrap .thumb-overlay { background: rgba(0, 0, 0, 0.32); }
      .archive-thumb:hover .thumb-title { opacity: 1; }
    }
 
    /* ── Footer ── */
    .site-footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      padding: 0 var(--pad);
      margin: 36px 0 40px;
    }
 
    .footer-left {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: flex-end;
    }
 
    .footer-emoji {
      font-size: 28px;
      line-height: 1;
      user-select: none;
    }
 
    .footer-link {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: lowercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }
 
    .footer-link:hover { color: var(--ink); }
 
    .footer-copy {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: lowercase;
      color: var(--muted);
      justify-self: start;
    }
 
    /* ── Header sticky base ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      transition: background 0.4s ease, padding 0.4s ease;
      padding: 44px 0 24px;
    }
 
    .header-row {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 var(--pad);
    }
 
    .title-block {
      overflow: hidden;
      max-width: 600px;
      transition: transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  opacity 0.35s ease,
                  max-width 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      transform-origin: left center;
    }
 
    .header-circle {
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      flex-shrink: 0;
    }
 
    header.minimized {
      background: rgba(247, 247, 247, 0.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding-top: 12px;
      padding-bottom: 12px;
    }
 
    header.minimized .title-block {
      transform: scale(0.2);
      opacity: 0;
      max-width: 0;
    }
 
    header.minimized .header-circle {
      transform: scale(1.18);
    }
 
    header.minimized .header-unit {
      gap: 0;
    }
 
    /* ── Responsive ── */
    @media (max-width: 760px) {
      :root { --article-inset: 16px; }
 
      .featured {
        grid-template-columns: 1fr;
        gap: 12px;
      }
 
      .featured-img { width: 100%; }
 
      .article-tags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
 
      /* hide image overlay tag on mobile — shown in .article-tags instead */
      .featured-img .article-tag,
      .thumb-img-wrap .article-tag { display: none; }
 
      /* hide desktop hover overlay title text on mobile */
      .thumb-title { display: none; }
 
      /* archive: single column feed */
      .archive {
        grid-template-columns: 1fr;
        gap: 28px;
      }
 
      .thumb-info {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px var(--article-inset) 0;
      }
 
      .thumb-headline {
        font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.15;
        text-transform: lowercase;
        color: var(--ink);
      }
 
      .thumb-excerpt {
        font-size: 14px;
        font-weight: 400;
        line-height: 1.65;
        color: var(--muted);
      }
    }
 
    @media (max-width: 520px) {
      :root { --pad: 24px; --gap: 10px; }
      header { padding-top: 56px; padding-bottom: 40px; }
    }
  </style>
</head>
<body>
  <div class="page-wrap">
 
  <header id="siteHeader">
    <div class="header-row">
      <div class="header-unit">
        <div class="header-circle"></div>
        <div class="title-block">
          <h1 class="site-title">
            <span>phlpp's</span>
            <span class="line-perspectives">perspectives</span>
          </h1>
          <p class="site-subtitle">from berlin w/ love</p>
        </div>
      </div>
    </div>
  </header>
 
  <main class="blog">
 
    <!-- featured + archive werden per JS aus articles.json befüllt -->
    <article class="featured" id="featuredArticle"></article>
    <div class="archive" id="archiveGrid"></div>
 
  </main>
 
  <footer class="site-footer">
    <div class="footer-left">
      <a href="/privacy.html" class="footer-link">privacy</a>
      <a href="/imprint.html" class="footer-link">imprint</a>
    </div>
    <span class="footer-emoji">💌</span>
    <span class="footer-copy">© 2026 phlpp</span>
  </footer>
 
  </div><!-- /page-wrap -->
 
  <script>
    // Netlify Identity: nach Login zu /admin weiterleiten
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', user => {
        if (!user) {
          window.netlifyIdentity.on('login', () => {
            document.location.href = '/admin/';
          });
        }
      });
    }
 
    // "from berlin w/ love" — startet nach dem zweiten 'p', endet beim 's'
    // "perspectives" = p(0)e(1)r(2)s(3)p(4)e(5)c(6)t(7)i(8)v(9)e(10)s(11)
    function sizeSubtitle() {
      const persEl  = document.querySelector('.line-perspectives');
      const subtitle = document.querySelector('.site-subtitle');
      if (!persEl || !subtitle || !persEl.firstChild) return;
      const node = persEl.firstChild;
 
      // Linker Einzug: Breite von "persp" (Index 0–5)
      const rLeft = document.createRange();
      rLeft.setStart(node, 0);
      rLeft.setEnd(node, 5);
      const leftOffset = rLeft.getBoundingClientRect().width;
 
      // Zielbreite: von Index 5 bis Ende (12)
      const rWidth = document.createRange();
      rWidth.setStart(node, 5);
      rWidth.setEnd(node, 12);
      const targetWidth = rWidth.getBoundingClientRect().width;
 
      subtitle.style.marginLeft = leftOffset + 'px';
 
      // Binärsuche für die passende font-size
      let lo = 6, hi = 40;
      for (let i = 0; i < 40; i++) {
        const mid = (lo + hi) / 2;
        subtitle.style.fontSize = mid + 'px';
        subtitle.offsetWidth > targetWidth ? (hi = mid) : (lo = mid);
      }
      subtitle.style.fontSize = lo + 'px';
    }
 
    document.fonts.ready.then(sizeSubtitle);
    window.addEventListener('resize', sizeSubtitle);
 
    // ── Artikel aus articles.json laden ─────────────────────────
    function parsePostedDate(str) {
      if (!str) return new Date(0);
      const [d, m, y] = str.split('.').map(Number);
      return new Date(y, m - 1, d);
    }
 
    function esc(str) {
      return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
 
    function renderFeatured(a) {
      const el = document.getElementById('featuredArticle');
      if (!el) return;
      const link = `article.html?slug=${encodeURIComponent(a.slug)}`;
      el.innerHTML = `
        <a href="${link}" class="featured-img">
          <img src="${esc(a.cover)}" alt="${esc(a.title)}" loading="lazy">
          <span class="article-tag">${esc(a.tag)}</span>
        </a>
        <div class="featured-text">
          <div class="article-tags"><span class="article-tag">${esc(a.tag)}</span></div>
          <span class="article-date">${esc(a.posted)}</span>
          <a href="${link}" class="article-title">${esc(a.title)}</a>
          <p class="article-excerpt">${esc(a.excerpt)}</p>
          <a href="${link}" class="read-more">read more</a>
        </div>`;
    }
 
    function renderArchive(articles) {
      const grid = document.getElementById('archiveGrid');
      if (!grid) return;
      grid.innerHTML = '';
      articles.forEach(a => {
        const link = `article.html?slug=${encodeURIComponent(a.slug)}`;
        const el = document.createElement('a');
        el.href = link;
        el.className = 'archive-thumb';
        el.innerHTML = `
          <div class="thumb-img-wrap">
            <img src="${esc(a.cover)}" alt="${esc(a.title)}" loading="lazy">
            <div class="thumb-overlay"><span class="thumb-title">${esc(a.title)}</span></div>
            <span class="article-tag">${esc(a.tag)}</span>
          </div>
          <div class="thumb-info">
            <div class="article-tags"><span class="article-tag">${esc(a.tag)}</span></div>
            <h3 class="thumb-headline">${esc(a.title)}</h3>
            <p class="thumb-excerpt">${esc(a.excerpt)}</p>
          </div>`;
        grid.appendChild(el);
      });
    }
 
    fetch('./articles.json')
      .then(r => r.json())
      .then(data => {
        const list = Array.isArray(data) ? data : (data.articles || []);
        list.sort((a, b) => parsePostedDate(b.posted) - parsePostedDate(a.posted));
        if (list.length > 0) renderFeatured(list[0]);
        if (list.length > 1) renderArchive(list.slice(1));
      })
      .catch(err => console.warn('articles.json nicht gefunden:', err));
 
    // Mobile: Header minimiert sich beim Runterscrollen, maximiert beim Hochscrollen
    (function() {
      const header = document.getElementById('siteHeader');
      if (!header) return;
      let lastY = 0;
      let ticking = false;
 
      function update() {
        const isMobile = window.innerWidth <= 760;
        if (!isMobile) { header.classList.remove('minimized'); ticking = false; return; }
        const y = window.scrollY;
        if (y > lastY && y > 60) {
          header.classList.add('minimized');
        } else if (y < lastY) {
          header.classList.remove('minimized');
        }
        lastY = y;
        ticking = false;
      }
 
      window.addEventListener('scroll', () => {
        if (!ticking) { requestAnimationFrame(update); ticking = true; }
      }, { passive: true });
    })();
  </script>
</html>
